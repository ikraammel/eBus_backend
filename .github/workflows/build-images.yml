name: Build images and test remote database

on:
  push:
    branches:
      - ci/docker-images
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend branch, tag or commit to build
        required: true
        default: ci/docker-images
        type: string
      api_base_url:
        description: Public API URL embedded in Flutter Web (never a secret)
        required: true
        default: http://127.0.0.1:18081
        type: string

permissions:
  contents: read

jobs:
  backend:
    name: Build backend image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build backend without database credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          tags: ebus-backend:ci
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/ebus-backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Upload backend image
        uses: actions/upload-artifact@v4
        with:
          name: ebus-backend-image
          path: ${{ runner.temp }}/ebus-backend.tar
          retention-days: 3
          compression-level: 0

  frontend:
    name: Build frontend image
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: ikraammel/eBus_frontend
          ref: ${{ inputs.frontend_ref || 'ci/docker-images' }}
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}
          persist-credentials: false
      - name: Verify required frontend files
        working-directory: frontend
        run: |
          test -f Dockerfile
          test -f nginx.conf
          test -f eBus_front/pubspec.yaml
          grep -q String.fromEnvironment eBus_front/lib/constants/constants.dart
          grep -q API_BASE_URL eBus_front/lib/constants/constants.dart
      - uses: docker/setup-buildx-action@v3
      - name: Build Flutter Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          build-args: |
            API_BASE_URL=${{ inputs.api_base_url || 'http://127.0.0.1:18081' }}
          tags: ebus-frontend:ci
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/ebus-frontend.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Upload frontend image
        uses: actions/upload-artifact@v4
        with:
          name: ebus-frontend-image
          path: ${{ runner.temp }}/ebus-frontend.tar
          retention-days: 3
          compression-level: 0

  tests:
    name: Test images with existing accounts and remote database
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify required secrets
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EBUS_USER_EMAIL: ${{ secrets.EBUS_USER_EMAIL }}
          EBUS_USER_PASSWORD: ${{ secrets.EBUS_USER_PASSWORD }}
          EBUS_ADMIN_EMAIL: ${{ secrets.EBUS_ADMIN_EMAIL }}
          EBUS_ADMIN_PASSWORD: ${{ secrets.EBUS_ADMIN_PASSWORD }}
        run: python ci/runtime.py validate
      - uses: actions/download-artifact@v4
        with:
          pattern: ebus-*-image
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Load built application images
        run: |
          docker load -i "$RUNNER_TEMP/images/ebus-backend.tar"
          docker load -i "$RUNNER_TEMP/images/ebus-frontend.tar"
      - name: Install native test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r ci/requirements.txt
          python -m playwright install-deps chromium
          google-chrome --version
      - name: Verify test safety guards offline
        run: |
          python -m unittest discover -s ci -p test_guards.py
          python -m unittest discover -s ci -p test_bootstrap.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native JMeter
        run: python ci/install_jmeter.py
      - name: Start images against remote PostgreSQL
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          EBUS_USER_EMAIL: ${{ secrets.EBUS_USER_EMAIL }}
          EBUS_USER_PASSWORD: ${{ secrets.EBUS_USER_PASSWORD }}
          EBUS_ADMIN_EMAIL: ${{ secrets.EBUS_ADMIN_EMAIL }}
          EBUS_ADMIN_PASSWORD: ${{ secrets.EBUS_ADMIN_PASSWORD }}
        run: python ci/runtime.py start
      - name: Wait for application readiness
        id: ready
        run: python ci/runtime.py ready
      - name: Robot Framework - existing USER API checks
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          EBUS_USER_EMAIL: ${{ secrets.EBUS_USER_EMAIL }}
          EBUS_USER_PASSWORD: ${{ secrets.EBUS_USER_PASSWORD }}
        run: python -m robot --loglevel NONE --log NONE --report ci-reports/robot-report.html --output ci-reports/robot-output.xml ci/api.robot
      - name: Playwright - guest, USER and ADMIN browser journeys
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          EBUS_BROWSER_CHANNEL: chrome
          EBUS_USER_EMAIL: ${{ secrets.EBUS_USER_EMAIL }}
          EBUS_USER_PASSWORD: ${{ secrets.EBUS_USER_PASSWORD }}
          EBUS_ADMIN_EMAIL: ${{ secrets.EBUS_ADMIN_EMAIL }}
          EBUS_ADMIN_PASSWORD: ${{ secrets.EBUS_ADMIN_PASSWORD }}
        run: python ci/browser.py
      - name: Playwright - business end-to-end scenarios
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          CI: true
          EBUS_BROWSER_CHANNEL: chrome
          EBUS_DEPLOYED_FRONTEND_URL: http://127.0.0.1:18082
          EBUS_API_BASE_URL: http://127.0.0.1:18081
          EBUS_USER_EMAIL: ${{ secrets.EBUS_USER_EMAIL }}
          EBUS_USER_PASSWORD: ${{ secrets.EBUS_USER_PASSWORD }}
          EBUS_ADMIN_EMAIL: ${{ secrets.EBUS_ADMIN_EMAIL }}
          EBUS_ADMIN_PASSWORD: ${{ secrets.EBUS_ADMIN_PASSWORD }}
        run: |
          mkdir -p ci-reports/business-playwright
          python qa-suites/playwright/business_e2e.py --case all --headless
      - name: JMeter - one USER, one iteration, seven requests
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        env:
          EBUS_USER_EMAIL: ${{ secrets.EBUS_USER_EMAIL }}
          EBUS_USER_PASSWORD: ${{ secrets.EBUS_USER_PASSWORD }}
        run: |
          mkdir -p ci-reports
          set +e
          jmeter -n -t ci/smoke.jmx -l ci-reports/jmeter.csv -j "$RUNNER_TEMP/jmeter.log" -Jjmeter.save.saveservice.output_format=csv -Jjmeter.save.saveservice.response_data=false -Jjmeter.save.saveservice.samplerData=false -Jjmeter.save.saveservice.requestHeaders=false -Jjmeter.save.saveservice.responseHeaders=false -Jjmeter.save.saveservice.assertion_results_failure_message=false -Jjmeter.save.saveservice.url=false
          runtime_status=$?
          python ci/summarize_jmeter.py
          summary_status=$?
          if [ "$runtime_status" -ne 0 ] || [ "$summary_status" -ne 0 ]; then
            exit 1
          fi
      - name: Upload test reports without raw logs or browser traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remote-database-test-reports
          path: |
            ci-reports/*.json
            ci-reports/*.html
            ci-reports/*.xml
            ci-reports/jmeter.csv
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop CI containers
        if: ${{ always() }}
        run: python ci/runtime.py stop
