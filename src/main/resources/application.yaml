server:
    port: ${PORT:8080}

spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 1
            idle-timeout: 30000
            max-lifetime: 300000

    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true

    # --- LA CORRECTION EST ICI ---
    # La section mail doit être alignée sous 'spring'
    mail:
        host: smtp.gmail.com
        port: 587
        username:
        password: ${MAIL_USERNAME} # Utilisez des guillemets pour éviter les erreurs avec les espaces
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
    # -----------------------------


