server:
    port: ${PORT:8080}

spring:
    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: 10
            minimum-idle: 1
            idle-timeout: 30000
            max-lifetime: 300000

    jpa:
        database-platform: org.hibernate.dialect.PostgreSQLDialect
        hibernate:
            ddl-auto: update
        show-sql: true

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

stripe:
    api:
        key: ${STRIPE_SECRET_KEY}

    webhook:
        secret: ${STRIPE_WEBHOOK_SECRET}

app:
    frontend-url: http://localhost:61624

jwt:
    secret: ${JWT_SECRET}
